name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install
      - run: bun run verify
      - name: Dogfood private registry install
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun run dogfood:registry
